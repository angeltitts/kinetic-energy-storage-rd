name: Phase 0 deterministic models
on:
  workflow_dispatch:
  push:
    paths:
      - "models/**"
      - "tests/**"
      - "ASSUMPTIONS.md"
      - "REQUIREMENTS.md"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Run baseline model
        run: python models/system_model.py
      - name: Run parameter sweep
        run: python models/parameter_sweep.py
      - name: Run Phase 1 feasibility model
        run: python models/phase1_feasibility.py
      - name: Run Phase 2 mass-budget model
        run: python models/phase2_mass_budget.py
      - name: Run Phase 3 segmented-containment model
        run: python models/phase3_segmented_containment.py
      - name: Upload model outputs
        uses: actions/upload-artifact@v4
        with:
          name: phase0-results
          path: |
            results/baseline.json
            results/phase0_sweep.csv
            results/phase1_500whkg_gate.csv
            results/phase2_mass_budget.csv
            results/phase3_segmented_containment.csv
